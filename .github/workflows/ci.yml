name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: bash -n install.sh
      - run: node --check bin/t3-tode.mjs
      - run: npm pack --dry-run
  installer-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh
      - shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
  native-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y libasound2t64 libnss3 libgtk-3-0t64 libgbm1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/ensure-backend.mjs
      - run: node node_modules/@zenbu-labs/pixel/scripts/postinstall.mjs
      - run: bash node_modules/@zenbu-labs/pixel/scripts/apparmor.sh "$PWD/node_modules/@zenbu-labs/pixel/electron/dist/pixel"
      - run: T3_TODE_SMOKE_SECONDS=45 T3_TODE_SMOKE_OWNED=1 python3 scripts/native-smoke.py 4785 /tmp/t3-tode-native-ci
      - name: Renderer diagnostics
        if: failure()
        run: |
          for file in "$HOME"/.local/state/pixel/logs/*.stderr.log /tmp/t3-tode-native-ci/userdata/logs/t3-tode-backend.log; do
            if [ -f "$file" ]; then tail -n 60 "$file"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-native-frame
          path: artifacts/native-terminal.png
          if-no-files-found: ignore
  official-t3-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise official Windows T3 installation and reuse
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:T3CODE_VERSION = '0.0.45'
          $env:T3CODE_HOME = Join-Path $env:RUNNER_TEMP 't3-code-home'
          $env:T3CODE_INSTALL_BIN_DIR = Join-Path $env:RUNNER_TEMP 't3-code-bin'
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw 'PowerShell installer has syntax errors.' }
          $function = $ast.Find({param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Install-OfficialT3'}, $true)
          . ([scriptblock]::Create($function.Extent.Text))
          Install-OfficialT3
          & t3 --version
          if ($LASTEXITCODE -ne 0) { throw 'Official T3 CLI failed.' }
          $before = (Get-Item (Join-Path $env:T3CODE_INSTALL_BIN_DIR 't3.cmd')).LastWriteTimeUtc
          Install-OfficialT3
          if ((Get-Item (Join-Path $env:T3CODE_INSTALL_BIN_DIR 't3.cmd')).LastWriteTimeUtc -ne $before) { throw 'Existing T3 CLI was reinstalled.' }
